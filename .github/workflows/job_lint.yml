name: Run Lint Test

on:
  workflow_call:

jobs:
  lint:
    name: Kotlinter
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 18
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '18'
        cache: gradle

    - name: Set up local.properties
      run: echo "AES_KEY=${{ secrets.AES_KEY }}" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # A committed zzz.variant=Live would silently point every default build at the production asset
    # branch, and nothing else in the build would complain. Switch machines via
    # ~/.gradle/gradle.properties instead.
    - name: Assert committed build variant is Dev
      run: |
        variant=$(sed -n 's/^zzz\.variant=//p' gradle.properties)
        if [ "$variant" != "Dev" ]; then
          echo "::error file=gradle.properties::zzz.variant must stay Dev in gradle.properties (found \"$variant\")"
          exit 1
        fi

    - name: Execute Kotlinter Check
      run: ./gradlew lintKotlin

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      with:
        name: lint-results-debug.html
        path: "**/build/reports/"