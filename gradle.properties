kotlin.code.style=official

#Gradle
# 8G stays here rather than in CI's GRADLE_OPTS: the iOS release framework link runs inside the
# Gradle daemon, and an Xcode archive only sees gradle.properties (this file or ~/.gradle's).
# headless: plugins in the daemon occasionally touch AWT (ImageIO and the like), which on macOS
# grabs the foreground and throws a full-screen app back to the desktop.
org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8 -Djava.awt.headless=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Parallel IDE sync. Only takes effect from Gradle 9.4; a no-op on older wrappers.
org.gradle.tooling.parallel=true

#Kotlin
kotlin.daemon.jvmargs=-Xmx4G -Djava.awt.headless=true

#macOS
macOsAppStoreRelease=false

#Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true

#Build variant: Dev or Live. The single source of truth for every module and platform.
#Pass -Pzzz.variant=Live when publishing.
zzz.variant=Dev
